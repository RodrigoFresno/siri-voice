<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050710;color:#f4f6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
#stage{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#20283b 0%,#111726 38%,#050710 76%,#03040a 100%);touch-action:none}
#gl{width:100%;height:100%;display:block;touch-action:none}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,#03040a88 100%)}
.topbar{position:fixed;top:calc(17px + env(safe-area-inset-top));left:19px;right:19px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5;text-shadow:0 1px 15px #000}
.brand{font-size:11px;font-weight:800;letter-spacing:.08em;color:#e9f4ff;opacity:.72}
.brand span{background:linear-gradient(90deg,#83edff,#c3a7ff 55%,#ff9fcf);-webkit-background-clip:text;background-clip:text;color:transparent}
.status{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:transparent;box-shadow:none}
.status i{display:block;width:6px;height:6px;margin:0;border-radius:50%;background:#ffffff22;box-shadow:none;transition:background .2s,box-shadow .2s}
body.mic-active .status i{background:#65e5a5;box-shadow:0 0 10px #65e5a5,0 0 18px #65e5a566}
.hero-caption{display:none}
.open-settings{position:fixed;z-index:12;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:11px 17px;border:1px solid #ffffff30;border-radius:999px;background:linear-gradient(135deg,#202b40d9,#111827d9);color:#f4f7ff;box-shadow:0 8px 35px #0008,inset 0 1px #ffffff20;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);font-size:10px;letter-spacing:.08em;font-weight:650;cursor:pointer;transition:opacity .25s,transform .25s}
.open-settings:active{transform:translateX(-50%) scale(.96)}
body.panel-open .open-settings{opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,12px)}
.open-settings svg{width:14px;height:14px}
.panel{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(9px + env(safe-area-inset-bottom));height:min(56dvh,520px);max-height:min(56dvh,520px);padding:12px 15px calc(10px + env(safe-area-inset-bottom));overflow:hidden;display:flex;flex-direction:column;overscroll-behavior:contain;background:linear-gradient(155deg,#1c2639f2,#0b101df5 76%);border:1px solid #ffffff28;border-radius:25px;backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);box-shadow:0 20px 80px #000b,inset 0 1px #ffffff20;transform:translateY(calc(100% + 30px));opacity:0;visibility:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility .42s}
body.panel-open .panel{transform:translateY(0);opacity:1;visibility:visible}
.panel-grabber{width:37px;height:4px;flex:0 0 4px;border-radius:9px;background:#ffffff45;margin:0 auto 10px}
.panel-content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.panelhead{flex:0 0 auto}
.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:-12px;padding:8px 0 10px;background:linear-gradient(180deg,#182235 80%,#18223500);z-index:3}
.panelhead strong{font-size:11px;letter-spacing:.13em;background:linear-gradient(90deg,#baf4ff,#d8c1ff 60%,#ffb6d7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:9px;color:#aebbd0}
.close-settings{border:1px solid #ffffff25;background:#ffffff0d;color:#eef4ff;border-radius:50%;width:30px;height:30px;font-size:16px;display:grid;place-items:center;cursor:pointer}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
button,.upload{font:600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f2f5ff;background:#ffffff0d;border:1px solid #ffffff24;border-radius:12px;padding:10px 12px;cursor:pointer;white-space:nowrap}
button:active,.upload:active{background:#ffffff25}
button.primary{background:linear-gradient(135deg,#8deaff30,#c6a5ff2d);border-color:#bdeaff70}
button.on{background:#74d9b51c;border-color:#8de9c17a}
.upload input{display:none}
.group{border-top:1px solid #ffffff17;padding:12px 0 4px}
.gtitle{font-size:9px;color:#b7c6df;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.control{min-width:0}
.control label{display:flex;justify-content:space-between;gap:6px;font-size:9px;color:#e0e7f4;margin-bottom:5px}
.control output{color:#9fe5ff;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:16px;margin:0;accent-color:#9edbff;touch-action:pan-y}
#waveHue{height:19px;border-radius:99px;appearance:none;-webkit-appearance:none;background:linear-gradient(90deg,#ff3434 0%,#ffe53b 17%,#43ed68 33%,#35e9e9 50%,#397bff 67%,#c33cff 83%,#ff3434 100%);box-shadow:inset 0 0 0 1px #ffffff55}
#waveHue::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid #dcecff;box-shadow:0 1px 8px #0009}
#waveHue::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #dcecff;box-shadow:0 1px 8px #0009}
.wave-color-row{display:flex;align-items:center;gap:12px}
.wave-color-row .control{flex:1;min-width:0}
.wave-color-reset{flex:0 0 auto;padding:9px 12px;border-radius:10px}
.credit{position:fixed;z-index:4;left:0;right:0;bottom:calc(4px + env(safe-area-inset-bottom));text-align:center;font-size:8px;letter-spacing:.04em;color:#b9c6d477;pointer-events:none;text-shadow:0 1px 8px #000}
.meterline{display:flex;align-items:center;gap:8px;margin:10px 0 5px}
.meterline span{font-size:8px;letter-spacing:.14em;color:#c1cce0}
.meter{height:4px;background:#ffffff1c;border-radius:5px;flex:1;overflow:hidden}
.meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,#79ddff,#c6a8ff,#ff9fcf);box-shadow:0 0 12px #8deaff}
.note{text-align:center;font-size:8px;color:#aebbd088;margin-top:9px}
@media(min-width:760px){
 .panel{left:auto;right:18px;top:50%;bottom:auto;height:auto;max-height:84vh;width:365px;transform:translate(0,-45%);border-radius:25px}
 body.panel-open .panel{transform:translate(0,-50%)}
 .open-settings{left:auto;right:24px;transform:none}
 .open-settings:active{transform:scale(.96)}
 body.panel-open .open-settings{transform:translateY(15px)}
 .grid{grid-template-columns:1fr}
}



@media (orientation:landscape) and (max-height:600px){
 .topbar{top:calc(7px + env(safe-area-inset-top));left:10px;right:10px}
 .brand{font-size:9px;letter-spacing:.02em;opacity:.55}
 .status{width:8px;height:8px}
 .open-settings{left:auto;right:9px;top:50%;bottom:auto;transform:translateY(-50%);width:28px;height:28px;padding:0;justify-content:center;gap:0;border-radius:50%;font-size:0;opacity:.62}
 .open-settings svg{width:13px;height:13px;transform:rotate(-90deg)}
 .open-settings:active{transform:translateY(-50%) scale(.94)}
 body.panel-open .open-settings{transform:translateY(calc(-50% + 10px))}
 .credit{display:none}
 .panel{left:auto;right:8px;top:auto;bottom:calc(7px + env(safe-area-inset-bottom));width:min(420px,calc(100vw - 16px));height:min(88dvh,360px);max-height:88dvh;padding:9px 12px calc(8px + env(safe-area-inset-bottom));border-radius:19px;transform:none;pointer-events:auto;z-index:20}
 body.panel-open .panel{left:auto;right:8px;top:auto;bottom:calc(7px + env(safe-area-inset-bottom));transform:none;pointer-events:auto;visibility:visible}
 .panelhead{top:0;padding:5px 0 7px;margin-bottom:7px;position:relative;z-index:5}
 .close-settings{position:relative;z-index:6;flex:0 0 30px;pointer-events:auto;touch-action:manipulation}
 .panel-grabber{margin-bottom:6px}
 .panel-content{padding-bottom:4px;pointer-events:auto}
}
</style></head>

<div id="stage"><canvas id="gl"></canvas></div>
<div class="topbar"><div class="brand"><span>LG</span></div><div class="status" aria-label="Indicador do microfone"><i></i></div></div>

<section class="panel" id="panel">
 <div class="panel-grabber"></div>
 <div class="panelhead"><div><strong>PERSONALIZAR EXPERIÊNCIA</strong><div class="sub" style="margin-top:5px">Ajuste o vidro do seu jeito</div></div><button class="close-settings" id="closeSettings" aria-label="Fechar configurações">×</button></div>
 <div class="panel-content">
 <div class="actions">
  <button id="mic" class="primary">◉ Ativar microfone</button>
  <button id="wave" class="on">Ondas: ligadas</button>
  <label class="upload">＋ Imagem de fundo<input id="photo" type="file" accept="image/*"></label>
  <button id="bgreset">Fundo original</button>
  <button id="reset">Redefinir</button>


 </div>
 <div class="meterline"><span>ÁUDIO</span><div class="meter"><b id="meter"></b></div><span id="level">0.00</span></div>
 <div class="group"><div class="gtitle">Cores das ondas</div><div class="wave-color-row"><div class="control"><label for="waveHue">Gama de cores <output id="waveHueValue">0° · original</output></label><input id="waveHue" type="range" min="-180" max="180" step="1" value="0"></div><button id="waveHueReset" class="wave-color-reset" type="button">Reset</button></div></div>
 <div class="group"><div class="gtitle">Fundo</div><div class="grid">
  <div class="control"><label>Intensidade do fundo <output id="vBG">55%</output></label><input id="BG" type="range" min="15" max="90" value="55"></div>
 </div></div>
 <div class="group"><div class="gtitle">Forma e posição</div><div class="grid">
  <div class="control"><label>Escala geral <output id="vSC">1.00</output></label><input id="SC" type="range" min="30" max="170" value="100"></div>
  <div class="control"><label>Posição horizontal <output id="vPX">0.50</output></label><input id="PX" type="range" min="5" max="95" value="50"></div>
  <div class="control"><label>Posição vertical <output id="vPY">0.48</output></label><input id="PY" type="range" min="8" max="88" value="48"></div>
  <div class="control"><label>Largura <output id="vHX">0.37</output></label><input id="HX" type="range" min="15" max="65" value="37"></div>
  <div class="control"><label>Altura <output id="vHY">0.25</output></label><input id="HY" type="range" min="8" max="48" value="25"></div>
  <div class="control"><label>Cantos arredondados <output id="vCR">1.00</output></label><input id="CR" type="range" min="0" max="100" value="100"></div>
 </div><div class="note">Um dedo move · dois dedos redimensionam</div></div>
 <div class="group"><div class="gtitle">Lente e refração</div><div class="grid">
  <div class="control"><label>Zoom <output id="vZM">1.02</output></label><input id="ZM" type="range" min="100" max="150" value="102"></div>
  <div class="control"><label>Largura da banda <output id="vBD">170</output></label><input id="BD" type="range" min="60" max="500" value="170"></div>
  <div class="control"><label>Cápsula esférica <output id="vDM">0.40</output></label><input id="DM" type="range" min="0" max="100" value="40"></div>
  <div class="control"><label aberração>Aberração de cor <output id="vAB">10</output></label><input id="AB" type="range" min="0" max="40" value="10"></div>
  <div class="control"><label>Desfoque do fundo <output id="vBL">1.8</output></label><input id="BL" type="range" min="0" max="40" value="18"></div>
 </div></div>
 <div class="group"><div class="gtitle">Camada escura superior</div><div class="grid">
  <div class="control"><label>Intensidade da área preta <output id="vTD">0.93</output></label><input id="TD" type="range" min="0" max="100" value="93"></div>
  <div class="control"><label>Ponto inicial da zona negra <output id="vB0">-1.00</output></label><input id="B0" type="range" min="-100" max="80" value="-100"></div>
  <div class="control"><label>Fim da zona negra <output id="vB1">-0.01</output></label><input id="B1" type="range" min="-50" max="120" value="-1"></div>
 </div></div>
 <div class="group"><div class="gtitle">Bordas e ondas luminosas</div><div class="grid">
  <div class="control"><label>Linha de borda <output id="vEB">0.11</output></label><input id="EB" type="range" min="0" max="200" value="11"></div>
  <div class="control"><label>Brilho da onda <output id="vWV">1.90</output></label><input id="WV" type="range" min="0" max="300" value="190"></div>
  <div class="control"><label>Escala da onda <output id="vWS">0.85</output></label><input id="WS" type="range" min="20" max="150" value="85"></div>
  <div class="control"><label>Sensibilidade da voz <output id="vGN">2.80</output></label><input id="GN" type="range" min="25" max="800" step="5" value="280"></div>
 </div></div>
 </div>
</section>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {

(()=>{
const openSettings=()=>document.body.classList.add('panel-open');
const closeSettings=()=>document.body.classList.remove('panel-open');
document.getElementById('openSettings').addEventListener('click',openSettings);
document.getElementById('closeSettings').addEventListener('click',closeSettings);
let panelTouchY;
document.getElementById('panel').addEventListener('touchstart',e=>{if(e.target.closest('.panel-grabber'))panelTouchY=e.touches[0].clientY;},{passive:true});
document.getElementById('panel').addEventListener('touchend',e=>{if(panelTouchY!==undefined){if(e.changedTouches[0].clientY-panelTouchY>90)closeSettings();panelTouchY=undefined;}},{passive:true});
const cv=document.getElementById('gl'),gl=cv.getContext('webgl',{alpha:false,antialias:true,preserveDrawingBuffer:false});
const state=document.getElementById('state');if(!gl){state.textContent='WEBGL INDISPONÍVEL';return}
const vs=`attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}`;
const fs=`precision highp float;
uniform vec2 iRes,uHalf,uCenter;uniform sampler2D iBg;
uniform float iTime,uCorner,uBand,uDome,uAberration,uTopDarken,uBlack0,uBlack1,uEdgeBleed,uWaveAmp,uWaveScale,uZoom,uScale,uBlur;
uniform vec3 uVoice;uniform float uEnergy,uWaveHue;
float sdRoundRect(vec2 c,vec2 h,float r){vec2 q=abs(c)-(h-vec2(r));return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
vec2 gradRect(vec2 c,vec2 h,float r){vec2 q=abs(c)-(h-vec2(r));if(q.x>=0.||q.y>=0.)return sign(c)*normalize(max(q,0.)+1e-6);float gx=step(q.y,q.x);return sign(c)*vec2(gx,1.-gx);}
float circleMap(float x){return 1.-sqrt(max(1.-x*x,0.));}
vec3 spectral(int s){float x=float(s);return clamp(vec3(abs(x-3.)-1.,2.-abs(x-2.),2.-abs(x-4.)),0.,1.);}
vec3 rotateHue(vec3 c,float angle){vec3 axis=normalize(vec3(1.));float cs=cos(angle),sn=sin(angle);return c*cs+cross(axis,c)*sn+axis*dot(axis,c)*(1.-cs);}
vec3 waveCol(vec2 p,float t,float spread){
 float low=clamp(uVoice.x,0.,1.),mid=clamp(uVoice.y,0.,1.),high=clamp(uVoice.z,0.,1.);
 float drift=mod(t,62.83)*2.4+uEnergy*2.0;
 float env=cos(1.5707963*min(abs(.9*p.x),1.));env*=env;
 float A1=.30+.06*low+uEnergy*.13,A2=A1+mid*.05+high*.06+uEnergy*.07,AB=2.6+mid*.8+high*.5;
 float th=.03*spread,inten=.01*(2.+low*1.5+uEnergy*2.0),soft=.01*max(0.,2.5+mid*.4+uEnergy)*spread;
 float yMain=A1*env*sin(p.x*1.1+drift);float bandAmt=26000.*inten;
 vec3 num=vec3(0.),den=vec3(0.);
 for(int s=0;s<4;s++){vec3 hue=rotateHue(spectral(s),uWaveHue);den+=hue;float ab=mix(-AB,AB,float(s)/3.);float yL=A2*env*sin(p.x+drift+ab);float dd=abs(p.y-yL);float line=inten/(sqrt(dd*dd+soft*soft)+th);float lo=min(yMain,yL),hi=max(yMain,yL);float db=max(0.,max(p.y-hi,lo-p.y));float band=bandAmt/(db+.08);num+=hue*(line+band*0.0001);}
 vec3 col=num/max(den,vec3(.001));float dm=abs(p.y-yMain);col+=.5*inten/(sqrt(dm*dm+soft*soft)+th);return pow(max(col,0.),vec3(1.5))*exp(-pow(p.x*1.2,2.));
}
vec3 sampleBlur(vec2 uv){vec2 px=vec2(uBlur)/iRes;vec3 c=texture2D(iBg,uv).rgb*.227027;c+=texture2D(iBg,uv+vec2(px.x,0.)*1.384615).rgb*.194595;c+=texture2D(iBg,uv-vec2(px.x,0.)*1.384615).rgb*.194595;c+=texture2D(iBg,uv+vec2(0.,px.y)*1.384615).rgb*.194595;c+=texture2D(iBg,uv-vec2(0.,px.y)*1.384615).rgb*.194595;c+=texture2D(iBg,uv+vec2(px.x,0.)*3.230769).rgb*.016216;c+=texture2D(iBg,uv-vec2(px.x,0.)*3.230769).rgb*.016216;return c;}
void main(){
 vec2 fc=gl_FragCoord.xy,uv=fc/iRes,uvf=vec2(uv.x,1.-uv.y),c=fc-uCenter;c.y=-c.y;
 float sd=sdRoundRect(c,uHalf,uCorner);vec3 bg=texture2D(iBg,uvf).rgb;if(sd>1.){gl_FragColor=vec4(bg,1.);return;}sd=min(sd,0.);
 float x=1.-(-sd/max(uBand,1.));float d=circleMap(clamp(x,0.,1.))*(165.+55.*uDome);
 float gr=min(uCorner*1.5,min(uHalf.x,uHalf.y));vec2 grad=normalize(gradRect(c,uHalf,gr)+uDome*1.2*normalize(c+1e-5));vec2 guv=vec2(grad.x,-grad.y);
 float liquidBend=1.0+0.16*uDome*sin(length(c)/max(min(uHalf.x,uHalf.y),1.0)*3.0);vec2 push=guv*d*liquidBend/iRes,center=vec2(uCenter.x,iRes.y-uCenter.y)/iRes;vec2 suv=uvf+push;suv=center+(suv-center)/uZoom;
 float dispI=uAberration*((c.x*c.y)/(uHalf.x*uHalf.y))/30.;vec2 disp=guv*d*dispI/iRes;
 vec3 col;col.r=sampleBlur(suv+disp).r;col.g=sampleBlur(suv).g;col.b=sampleBlur(suv-disp).b;
 col=mix(col,col*vec3(.91,.95,1.)+vec3(.012,.018,.03),.27);float glassSpec=pow(max(0.0,1.0-length((c/uHalf)-vec2(-.38,.58))),5.0);col+=vec3(.34,.52,.68)*glassSpec*.13;
 float ny=-c.y/uHalf.y;float black=smoothstep(uBlack0,uBlack1,ny);black=black*black*(3.-2.*black);col=mix(col,vec3(.012,.015,.025),black*uTopDarken);
 vec3 wglow=vec3(0.);if(uWaveAmp>.001){vec2 cw=(c+vec2(grad.x,-grad.y)*d*.5)/uZoom;vec2 wp=vec2(cw.x/uHalf.x,-cw.y/uHalf.y-uBlack1)/max(uWaveScale,.1);float vis=1.-black*uTopDarken*.85;wglow=waveCol(wp,iTime,7.)*vec3(.8,.95,1.25);float below=smoothstep(.7,-.5,wp.y);col+=(waveCol(wp,iTime,1.)+wglow*(.25+.6*below))*uWaveAmp*vis;}
 float inner=smoothstep(0.,-18.*uScale,sd);col*=mix(.70,1.,inner);
 float mid=(uBlack0+uBlack1)*.5;float eq=smoothstep(uBlack0,mid,ny)*smoothstep(uBlack1,mid,ny);float horiz=1.-abs(c.x)/uHalf.x*.3;col+=vec3(.95,.97,1.)*eq*horiz*uEdgeBleed;
 float rim=smoothstep(-14.*uScale,-2.*uScale,sd)*smoothstep(0.,-.6,-ny);col+=vec3(.85,.88,.95)*rim*uEdgeBleed*.5;col+=wglow*uWaveAmp*(eq*horiz+rim)*.9;
 float shell=smoothstep(3.*uScale,0.,abs(sd+2.5*uScale));float lit=.3+.7*smoothstep(.3,-.9,ny);col+=(vec3(.10,.11,.13)+wglow*uWaveAmp*1.2)*shell*lit;
 float aa=smoothstep(1.5,-1.5,sd);col=mix(bg,col,aa);gl_FragColor=vec4(col,1.);
}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}

const U=n=>gl.getUniformLocation(pr,n),u={res:U('iRes'),half:U('uHalf'),center:U('uCenter'),time:U('iTime'),corner:U('uCorner'),band:U('uBand'),dome:U('uDome'),ab:U('uAberration'),dark:U('uTopDarken'),b0:U('uBlack0'),b1:U('uBlack1'),edge:U('uEdgeBleed'),wave:U('uWaveAmp'),ws:U('uWaveScale'),zoom:U('uZoom'),scale:U('uScale'),blur:U('uBlur'),voice:U('uVoice'),energy:U('uEnergy'),waveHue:U('uWaveHue'),bg:U('iBg')};
let tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.uniform1i(u.bg,0);
let W=1,H=1,photoAspect=1;
function makeGradient(darkness=55){let c=document.createElement('canvas');c.width=900;c.height=1600;let x=c.getContext('2d');let g=x.createLinearGradient(0,0,900,1600);g.addColorStop(0,'#62636a');g.addColorStop(.42,'#34363d');g.addColorStop(1,'#15161b');x.fillStyle=g;x.fillRect(0,0,900,1600);let rg=x.createRadialGradient(450,650,40,450,650,850);rg.addColorStop(0,'rgba(205,211,224,.20)');rg.addColorStop(1,'rgba(10,11,15,0)');x.fillStyle=rg;x.fillRect(0,0,900,1600);let shade=Math.max(0,(darkness-35)/110);x.fillStyle='rgba(0,0,0,'+shade.toFixed(3)+')';x.fillRect(0,0,900,1600);return c}
function uploadImage(img){let c=document.createElement('canvas');c.width=900;c.height=1600;let x=c.getContext('2d');let ar=img.width/img.height,tar=c.width/c.height,sx=0,sy=0,sw=img.width,sh=img.height;if(ar>tar){sw=img.height*tar;sx=(img.width-sw)/2}else{sh=img.width/tar;sy=(img.height-sh)/2}x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c)}
function setBg(c){gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c)}
let p={scale:1,px:.5,py:.48,hx:.37,hy:.25,cr:1,zoom:1.02,band:170,dome:.4,ab:10,blur:1.8,td:.93,b0:-1,b1:-.01,eb:.11,wv:1.9,ws:.85,gain:2.8,bg:55};
let bgMode='gradient';
let waveHue=0;
const waveHueInput=document.getElementById('waveHue'),waveHueValue=document.getElementById('waveHueValue');
function setWaveHue(value){waveHue=Number(value);waveHueInput.value=String(waveHue);waveHueValue.textContent=waveHue===0?'0° · original':(waveHue>0?'+':'')+waveHue+'°';}
waveHueInput.addEventListener('input',()=>setWaveHue(waveHueInput.value));
document.getElementById('waveHueReset').addEventListener('click',()=>setWaveHue(0));
setBg(makeGradient(p.bg));
const defs={SC:['scale',.01,x=>x.toFixed(2)],PX:['px',.01,x=>x.toFixed(2)],PY:['py',.01,x=>x.toFixed(2)],HX:['hx',.01,x=>x.toFixed(2)],HY:['hy',.01,x=>x.toFixed(2)],CR:['cr',.01,x=>x.toFixed(2)],ZM:['zoom',.01,x=>x.toFixed(2)],BD:['band',1,x=>x.toFixed(0)],DM:['dome',.01,x=>x.toFixed(2)],AB:['ab',1,x=>x.toFixed(0)],BL:['blur',.1,x=>x.toFixed(1)],TD:['td',.01,x=>x.toFixed(2)],B0:['b0',.01,x=>x.toFixed(2)],B1:['b1',.01,x=>x.toFixed(2)],EB:['eb',.01,x=>x.toFixed(2)],WV:['wv',.01,x=>x.toFixed(2)],WS:['ws',.01,x=>x.toFixed(2)],GN:['gain',.01,x=>x.toFixed(2)],BG:['bg',1,x=>x.toFixed(0)+'%']};
Object.entries(defs).forEach(([id,[key,mul,fmt]])=>{let el=document.getElementById(id),out=document.getElementById('v'+id);el.addEventListener('input',()=>{p[key]=+el.value*mul;out.textContent=fmt(p[key]);if(key==='bg'&&bgMode==='gradient')setBg(makeGradient(p.bg))})});
function reset(){bgMode='gradient';setWaveHue(0);Object.entries(defs).forEach(([id,[key]])=>{let el=document.getElementById(id);el.value=({SC:100,PX:50,PY:48,HX:37,HY:25,CR:100,ZM:102,BD:170,DM:40,AB:10,BL:18,TD:93,B0:-100,B1:-1,EB:11,WV:190,WS:85,GN:280,BG:55})[id];el.dispatchEvent(new Event('input'))});p.px=.5;p.py=.48;setBg(makeGradient(p.bg))}
document.getElementById('reset').onclick=reset;document.getElementById('bgreset').onclick=()=>{bgMode='gradient';setBg(makeGradient(p.bg))};
document.getElementById('photo').addEventListener('change',e=>{let f=e.target.files&&e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),img=new Image();img.onload=()=>{bgMode='photo';uploadImage(img);URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);alert('Não foi possível abrir essa imagem')};img.src=url});
let waveOn=true;document.getElementById('wave').onclick=e=>{waveOn=!waveOn;e.currentTarget.classList.toggle('on',waveOn);e.currentTarget.textContent='Onda: '+(waveOn?'ligada':'desligada')};
let audioCtx=null,analyser=null,stream=null,freq=null,timeData=null,voice=[.2,.2,.2,0],smooth=[.2,.2,.2,0];
async function startMic(){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});audioCtx=new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();let src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.28;src.connect(analyser);freq=new Uint8Array(analyser.frequencyBinCount);timeData=new Uint8Array(analyser.fftSize);document.getElementById('mic').textContent='■ Parar microfone';document.getElementById('mic').classList.add('on');document.body.classList.add('mic-active');state.textContent=''}catch(e){state.textContent='MICROFONE BLOQUEADO';alert('Abra pelo GitHub Pages (HTTPS), toque em Ativar microfone e permita o acesso quando o Safari solicitar.')}}
function stopMic(){if(stream)stream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();stream=null;audioCtx=null;analyser=null;document.getElementById('mic').textContent='◉ Ativar microfone';document.getElementById('mic').classList.remove('on');document.body.classList.remove('mic-active');state.textContent=''}
document.getElementById('mic').onclick=()=>stream?stopMic():startMic();
function audio(){let target=[.18,.18,.18,0];if(analyser){analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(timeData);let sum=0;for(let v of timeData){let x=(v-128)/128;sum+=x*x}let rms=Math.sqrt(sum/timeData.length);function band(a,b){let s=0,n=0;for(let i=Math.floor(freq.length*a);i<Math.max(1,Math.floor(freq.length*b));i++){s+=freq[i]/255;n++}return s/n}target=[band(0,.08),band(.08,.35),band(.35,.9),Math.min(1,Math.max(0,(rms-.002)*25*p.gain))];target[0]=Math.min(1,target[0]*p.gain);target[1]=Math.min(1,target[1]*p.gain);target[2]=Math.min(1,target[2]*p.gain)}for(let i=0;i<4;i++)smooth[i]+=(target[i]-smooth[i])*(target[i]>smooth[i]?.62:.16);document.getElementById('meter').style.width=(smooth[3]*100)+'%';document.getElementById('level').textContent=smooth[3].toFixed(2);voice=smooth}

let pointers=new Map(),drag=null,pinch=null;
function coords(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);let q=coords(e);pointers.set(e.pointerId,q);if(pointers.size===1)drag={id:e.pointerId,x:q.x,y:q.y,px:p.px,py:p.py};if(pointers.size===2){let a=[...pointers.values()];pinch={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale:p.scale}}});
cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let q=coords(e);pointers.set(e.pointerId,q);if(pointers.size===1&&drag){p.px=clamp(drag.px+(q.x-drag.x)*1.0,.05,.95);p.py=clamp(drag.py+(q.y-drag.y)*1.0,.08,.9);syncPos()}if(pointers.size===2&&pinch){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);p.scale=clamp(pinch.scale*d/Math.max(.001,pinch.dist),.3,1.7);document.getElementById('SC').value=Math.round(p.scale*100);document.getElementById('SC').dispatchEvent(new Event('input'))}});
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function syncPos(){for(let [id,key] of [['PX','px'],['PY','py']]){let el=document.getElementById(id);el.value=Math.round(p[key]*100);document.getElementById('v'+id).textContent=p[key].toFixed(2)}}
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(pointers.size===0)drag=null}
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);
function resize(){let d=Math.min(devicePixelRatio||1,2);let w=Math.max(1,Math.round(innerWidth*d)),h=Math.max(1,Math.round(innerHeight*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}}new ResizeObserver(resize).observe(cv);resize();
let start=performance.now();
function frame(now){resize();audio();let w=cv.width,h=cv.height,short=Math.min(w,h);gl.useProgram(pr);gl.uniform2f(u.res,w,h);gl.uniform2f(u.half,w*p.hx*p.scale,w*p.hy*p.scale);gl.uniform2f(u.center,w*p.px,h*(1-p.py));gl.uniform1f(u.corner,Math.min(w*p.hy*p.cr*p.scale,w*p.hx*p.scale,h*p.hy*p.scale));gl.uniform1f(u.time,(now-start)/1000);gl.uniform1f(u.band,p.band*p.scale);gl.uniform1f(u.dome,p.dome);gl.uniform1f(u.ab,p.ab);gl.uniform1f(u.dark,p.td);gl.uniform1f(u.b0,p.b0);gl.uniform1f(u.b1,p.b1);gl.uniform1f(u.edge,p.eb);gl.uniform1f(u.wave,waveOn?p.wv:0);gl.uniform1f(u.ws,p.ws);gl.uniform1f(u.zoom,p.zoom);gl.uniform1f(u.scale,p.scale);gl.uniform1f(u.blur,p.blur*4);gl.uniform3f(u.voice,voice[0],voice[1],voice[2]);gl.uniform1f(u.energy,voice[3]);gl.uniform1f(u.waveHue,waveHue*0.01745329252);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.addEventListener('beforeunload',stopMic);
